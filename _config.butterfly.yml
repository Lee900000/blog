# Keep Butterfly 5.7's native layout and styling; override only local identity.
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  友链: /link/ || fas fa-link
  代表作品: /works/ || fas fa-code
  币圈指南:
    术语字典: /archives/5596f036.html || fas fa-book
    量化套利: /arbitrage/ || fas fa-chart-line
    调研清单: /research/ || fas fa-magnifying-glass-chart
  关于: /about/ || fas fa-user

search:
  use: local_search
  placeholder: 搜索文章
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false
    pagination:
      enable: true
      hitsPerPage: 8

avatar:
  img: /assets/profile/leon-avatar-tago.png
  effect: false
favicon: /assets/brand/favicon.svg

nav:
  logo: /assets/brand/tago-logo-hero.svg
  display_title: true
  display_post_title: true

# Keep the user toggle, but open the site in dark mode by default.
display_mode: dark

subtitle:
  enable: true
  effect: true
  source: false
  typed_option:
    typeSpeed: 65
    startDelay: 400
    loop: false
    showCursor: true
    contentType: html
  sub:
    - '如果说我看得比别人更远些，那是因为我站在巨人的肩膀上。<br>而这个博客，就是我的巨人！'

disable_top_img: false
# Official demo's photograph (not the promotional device mockup).
# https://github.com/jerryc127/butterfly.js.org/blob/main/_config.butterfly.yml
# https://oss.012700.xyz/butterfly/2024/10/index.jpg
index_img: /assets/theme/butterfly-teal-smoke.jpg
default_top_img: /assets/theme/butterfly-teal-smoke.jpg

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  # Upstream 5.7 supplies no default cover. Image posts use their own frontmatter.
  default_cover:

aside:
  card_author:
    description: 技术、实践与记录
    button:
      enable: false
  card_announcement:
    enable: true
    content: 记录技术实践，分享学习与思考。
  card_newest_comments:
    # Giscus stores discussions in GitHub and does not provide this widget.
    enable: false
    limit: 6
    storage: 0
    avatar: true
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    # Earliest migrated publication: 2015-07-01 (manifest metadata).
    runtime_date: '2015/07/01 00:00:00'

footer:
  owner:
    enable: true
    since: 2015
  custom_text: Tago · 开发手记

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

canvas_ribbon:
  enable: true
  size: 150
  alpha: 0.6
  zIndex: -1
  click_to_change: false
  mobile: false

comments:
  use:
    - Giscus
  text: true
  # Render directly so the comment entry remains visible after opening a post anchor.
  lazyload: false
  count: false
  card_post_count: false

giscus:
  # Comments live in a dedicated repository, separate from blog source code.
  repo: Lee900000/tago-comments
  repo_id: R_kgDOVaGC8w
  category_id: DIC_kwDOVaGC884DJzII
  light_theme: light
  dark_theme: dark
  option:
    data-mapping: pathname
    data-strict: '1'
    data-reactions-enabled: '1'
    data-emit-metadata: '0'
    data-input-position: bottom
    data-lang: zh-CN

CDN:
  option:

mermaid:
  enable: true
  code_write: true
  zoom_pan: false
  open_in_new_tab: false

inject:
  head:
    - <link rel="stylesheet" href="/css/activity.css">
    - <link rel="stylesheet" href="/css/token-usage.css">
    - <link rel="stylesheet" href="/css/brand.css">
    - <link rel="icon" href="/assets/brand/favicon.ico" sizes="32x32">
    - <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
    - <link rel="stylesheet" href="/css/arbitrage.css">
    - <link rel="stylesheet" href="/css/works.css">
  bottom:
    - <script defer src="/js/activity.js"></script>
    - <script defer src="/js/token-usage.js"></script>
    - <script defer src="/js/arbitrage.js"></script>
    - <script defer src="/js/works.js"></script>
