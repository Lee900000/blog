server {
    listen 80;
    server_name tago.top www.tago.top;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://tago.top$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.tago.top;
    ssl_protocols TLSv1.2;
    ssl_certificate /etc/letsencrypt/live/tago.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tago.top/privkey.pem;
    return 301 https://tago.top$request_uri;
}
server {
    listen 443 ssl;
    server_name tago.top;
    ssl_certificate /etc/letsencrypt/live/tago.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tago.top/privkey.pem;
    ssl_protocols TLSv1.2;
    root /opt/webserver/tago;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    add_header X-Content-Type-Options nosniff always;
}
