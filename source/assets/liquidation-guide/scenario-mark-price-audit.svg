<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">标记价争议的可回放验证</title><desc id="desc">通过示例比较最新成交价、指数价和标记价，显示标记价争议需要回放输入数据、算法版本和强平触发快照。</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L11 6L0 12z" fill="#76e0df"/></marker></defs>
  <rect width="1440" height="720" rx="30" fill="#112526"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="60" y="68" fill="#edffff" font-size="32" font-weight="700">场景三：标记价异常，争议应该怎样被独立复算？</text>
    <text x="60" y="105" fill="#a8c6c6" font-size="18">示例：最新成交价短暂跌至 90，但指数价仍为 98；标记价为什么是 97、93 还是 90，必须有记录。</text>
    <g><rect x="60" y="150" width="460" height="430" rx="20" fill="#0d191a" stroke="#356467"/><text x="92" y="200" fill="#eaffff" font-size="24" font-weight="700">同一时点的三种价格</text><path d="M95 260H486M95 340H486M95 420H486" stroke="#264749"/><g stroke-width="10"><path d="M160 280V345" stroke="#55cda5"/><rect x="144" y="298" width="32" height="28" fill="#55cda5"/><path d="M240 275V348" stroke="#55cda5"/><rect x="224" y="292" width="32" height="32" fill="#55cda5"/><path d="M320 305V470" stroke="#ed7181"/><rect x="304" y="330" width="32" height="75" fill="#ed7181"/><path d="M400 340V405" stroke="#55cda5"/><rect x="384" y="355" width="32" height="30" fill="#55cda5"/></g><text x="110" y="505" fill="#ffbd6c" font-size="20" font-weight="700">最新成交价 = 90</text><text x="110" y="540" fill="#98e6e2" font-size="20" font-weight="700">指数价 = 98</text></g>
    <path d="M535 365H590" stroke="#76e0df" stroke-width="4" marker-end="url(#arrow)"/>
    <g><rect x="615" y="150" width="315" height="430" rx="20" fill="#163536" stroke="#4ba5a4"/><text x="647" y="200" fill="#edffff" font-size="24" font-weight="700">平台给出的 Pm</text><text x="647" y="280" fill="#c4e7e6" font-size="19">标记价 Pm</text><text x="872" y="280" fill="#74e2de" font-size="28" text-anchor="end">93</text><path d="M647 307H895" stroke="#477a79"/><text x="647" y="363" fill="#c4e7e6" font-size="18">若它触发强平，</text><text x="647" y="395" fill="#c4e7e6" font-size="18">平台必须说明：</text><text x="647" y="444" fill="#f0ffff" font-size="19">98 如何算成 93？</text><text x="647" y="493" fill="#f0ffff" font-size="19">是正常平滑，还是异常源？</text></g>
    <path d="M945 365H1000" stroke="#76e0df" stroke-width="4" marker-end="url(#arrow)"/>
    <g><rect x="1025" y="150" width="355" height="430" rx="20" fill="#173f3f" stroke="#4bb9b2"/><text x="1057" y="200" fill="#ecfffd" font-size="24" font-weight="700">可复算的证据</text><g font-size="19"><text x="1057" y="270" fill="#72e1d6" font-weight="700">1. 输入</text><text x="1057" y="302" fill="#cae9e7">指数源、权重、时间戳</text><text x="1057" y="350" fill="#72e1d6" font-weight="700">2. 算法</text><text x="1057" y="382" fill="#cae9e7">窗口、限幅、回退、版本号</text><text x="1057" y="430" fill="#72e1d6" font-weight="700">3. 触发</text><text x="1057" y="462" fill="#cae9e7">Pm、权益、MM、强平单</text></g><rect x="1057" y="502" width="290" height="42" rx="12" fill="#275552"/><text x="1076" y="530" fill="#d3f5f1" font-size="17">没有这三段，外部无法验证。</text></g>
    <rect x="60" y="620" width="1320" height="48" rx="14" fill="#1d4040"/><text x="88" y="651" fill="#d3f5f1" font-size="19">结论：标记价和最新成交价可以不同；问题在于平台能否让每一个差值、参数和触发结果被复放。</text>
  </g>
</svg>
