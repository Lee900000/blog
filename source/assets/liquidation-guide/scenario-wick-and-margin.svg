<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">插针是否应触发强平的推演</title><desc id="desc">以多头仓位为例，逐步比较最新成交价、标记价、权益和维持保证金，说明最低成交价插针本身不必然代表应强平。</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L11 6L0 12z" fill="#78ddea"/></marker></defs>
  <rect width="1440" height="720" rx="30" fill="#0f1c2a"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="60" y="68" fill="#f2fbff" font-size="32" font-weight="700">场景一：一根插针，为什么不能只看最低成交价？</text>
    <text x="60" y="105" fill="#9bb5c8" font-size="18">假设：多头 1 BTC，开仓 100，账户权益 12，维持保证金 MM = 8。以下都是示例数值。</text>
    <g><rect x="60" y="150" width="465" height="430" rx="20" fill="#0a1520" stroke="#35566e"/><text x="92" y="200" fill="#dff6ff" font-size="24" font-weight="700">市场K线：出现一笔向下插针</text><path d="M94 265H490M94 350H490M94 435H490" stroke="#20394d"/><g stroke-width="9"><path d="M150 285V350" stroke="#4ed3a5"/><rect x="134" y="305" width="32" height="28" fill="#4ed3a5"/><path d="M230 275V340" stroke="#4ed3a5"/><rect x="214" y="290" width="32" height="28" fill="#4ed3a5"/><path d="M310 300V458" stroke="#ed7180"/><rect x="294" y="325" width="32" height="65" fill="#ed7180"/><path d="M390 320V385" stroke="#4ed3a5"/><rect x="374" y="335" width="32" height="28" fill="#4ed3a5"/></g><text x="106" y="500" fill="#ffbf70" font-size="22" font-weight="700">最低成交价 = 91</text><text x="106" y="534" fill="#a9c1cf" font-size="18">一根 K 线只能证明有人以 91 成交。</text></g>
    <path d="M540 365H605" stroke="#78ddea" stroke-width="4" marker-end="url(#arrow)"/>
    <g><rect x="630" y="150" width="360" height="430" rx="20" fill="#132d3d" stroke="#4290a6"/><text x="662" y="200" fill="#e9fbff" font-size="24" font-weight="700">风控使用标记价</text><text x="662" y="260" fill="#a8c9d7" font-size="19">指数价 Pi</text><text x="890" y="260" fill="#f3fbff" font-size="22" text-anchor="end">99</text><path d="M662 284H958" stroke="#3d6678"/><text x="662" y="330" fill="#a8c9d7" font-size="19">标记价 Pm</text><text x="890" y="330" fill="#6fe3ec" font-size="22" text-anchor="end">97</text><path d="M662 354H958" stroke="#3d6678"/><text x="662" y="400" fill="#a8c9d7" font-size="19">未实现亏损</text><text x="890" y="400" fill="#ffbf70" font-size="22" text-anchor="end">-3</text><path d="M662 424H958" stroke="#3d6678"/><text x="662" y="470" fill="#a8c9d7" font-size="19">当前权益</text><text x="890" y="470" fill="#6ee1b8" font-size="22" text-anchor="end">9</text><text x="662" y="532" fill="#71dfc1" font-size="19" font-weight="700">9 ＞ MM 8：此时不应强平</text></g>
    <path d="M1005 365H1070" stroke="#78ddea" stroke-width="4" marker-end="url(#arrow)"/>
    <g><rect x="1095" y="150" width="285" height="430" rx="20" fill="#172b32" stroke="#4ab58c"/><text x="1125" y="200" fill="#e8fff6" font-size="24" font-weight="700">真正要问的事</text><text x="1125" y="265" fill="#bfe4d9" font-size="19">若 Pm 也跌到 91：</text><text x="1125" y="307" fill="#ffbf70" font-size="22">权益 = 3 ＜ MM 8</text><text x="1125" y="350" fill="#f3f7fa" font-size="20" font-weight="700">强平才有计算基础</text><path d="M1125 385H1350" stroke="#3d7d6b"/><text x="1125" y="425" fill="#bfe4d9" font-size="18">要核验：</text><text x="1125" y="458" fill="#d7f3e9" font-size="18">• Pm 的输入与窗口</text><text x="1125" y="490" fill="#d7f3e9" font-size="18">• MM 档位是否变化</text><text x="1125" y="522" fill="#d7f3e9" font-size="18">• 强平时点的完整快照</text></g>
    <rect x="60" y="620" width="1320" height="48" rx="14" fill="#1d3446"/><text x="88" y="651" fill="#cfeaf7" font-size="19">结论：插针不是免责词，也不是定罪证据；必须把“成交价 → 标记价 → 权益 → MM”串成同一时点的计算链。</text>
  </g>
</svg>
