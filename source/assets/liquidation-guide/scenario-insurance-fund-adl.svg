<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">风险基金与自动减仓的缺口推演</title><desc id="desc">极端行情下，先在订单簿平仓，再由风险基金覆盖破产价后的缺口；只有可用能力不足才应该进入自动减仓。</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L11 6L0 12z" fill="#f1bd6c"/></marker></defs>
  <rect width="1440" height="720" rx="30" fill="#191728"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="60" y="68" fill="#fcf7ff" font-size="32" font-weight="700">场景二：风险基金明明很大，为什么还会发生 ADL？</text>
    <text x="60" y="105" fill="#c7bdd4" font-size="18">示例：被强平仓位的破产价为 95，订单簿最终只能成交在 88，产生 7 的清算缺口。</text>
    <g><rect x="60" y="150" width="355" height="430" rx="20" fill="#111020" stroke="#514b70"/><text x="92" y="200" fill="#f3edff" font-size="24" font-weight="700">极端跳空 K 线</text><path d="M94 275H380M94 370H380M94 465H380" stroke="#3e3958"/><g stroke-width="10"><path d="M145 295V355" stroke="#58cfa9"/><rect x="129" y="312" width="32" height="27" fill="#58cfa9"/><path d="M220 285V350" stroke="#58cfa9"/><rect x="204" y="300" width="32" height="30" fill="#58cfa9"/><path d="M295 325V500" stroke="#ec7282"/><rect x="279" y="350" width="32" height="85" fill="#ec7282"/></g><path d="M94 410H380" stroke="#ffbd65" stroke-width="3" stroke-dasharray="9 8"/><text x="108" y="447" fill="#ffd18e" font-size="18">破产价 = 95</text><text x="108" y="535" fill="#ed9ba6" font-size="18">订单簿成交 = 88</text></g>
    <path d="M430 365H487" stroke="#f1bd6c" stroke-width="4" marker-end="url(#arrow)"/>
    <g><rect x="512" y="150" width="290" height="430" rx="20" fill="#1a303f" stroke="#53aac3"/><text x="544" y="200" fill="#eaffff" font-size="24" font-weight="700">先算“缺口”</text><text x="544" y="274" fill="#b8d8e6" font-size="19">破产价</text><text x="754" y="274" fill="#f9fdff" font-size="22" text-anchor="end">95</text><text x="544" y="326" fill="#b8d8e6" font-size="19">实际成交价</text><text x="754" y="326" fill="#f9fdff" font-size="22" text-anchor="end">88</text><path d="M544 353H770" stroke="#446778"/><text x="544" y="409" fill="#ffca78" font-size="20" font-weight="700">需要覆盖的缺口 = 7</text><text x="544" y="468" fill="#a8c7d5" font-size="18">风险基金不是</text><text x="544" y="498" fill="#a8c7d5" font-size="18">把已亏损仓位赔回去，</text><text x="544" y="528" fill="#a8c7d5" font-size="18">而是补这一段差额。</text></g>
    <path d="M817 365H874" stroke="#f1bd6c" stroke-width="4" marker-end="url(#arrow)"/>
    <g><rect x="900" y="150" width="480" height="430" rx="20" fill="#20342e" stroke="#51b98f"/><text x="932" y="200" fill="#ecfff7" font-size="24" font-weight="700">基金能否先接住？</text><g font-size="20"><text x="932" y="274" fill="#aee0ce">情况 A</text><text x="1050" y="274" fill="#e3f8ef">对应池可用能力 ≥ 7</text><text x="932" y="311" fill="#6de0b7">结果</text><text x="1050" y="311" fill="#c7f0df">基金覆盖，通常不应 ADL</text><path d="M932 344H1346" stroke="#477b69"/><text x="932" y="400" fill="#aee0ce">情况 B</text><text x="1050" y="400" fill="#e3f8ef">对应池 / 接管上限 ＜ 7</text><text x="932" y="437" fill="#ffbf78">结果</text><text x="1050" y="437" fill="#ffe4bd">才可能按队列进入 ADL</text></g><rect x="932" y="482" width="412" height="58" rx="12" fill="#2a473d"/><text x="954" y="518" fill="#d3f4e5" font-size="18">核验：不是总余额，是同一池的实时可用能力。</text></g>
    <rect x="60" y="620" width="1320" height="48" rx="14" fill="#322b46"/><text x="88" y="651" fill="#eee7ff" font-size="19">用户应能看到：该池余额、可接管上限、订单簿处理记录、缺口金额、ADL 队列与减仓价格。</text>
  </g>
</svg>
