<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-labelledby="title">
<title id="title">Ave 钱包模式与资金控制关系</title><rect width="1080" height="640" rx="28" fill="#f5f8fc"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="48" y="55" font-size="15" font-weight="700" letter-spacing="2" fill="#70879c">AVE.AI · 资金与权限</text><text x="48" y="96" font-size="28" font-weight="700" fill="#173149">资金是否安全，先看钱包由谁控制</text>
<rect x="48" y="132" width="984" height="125" rx="17" fill="#fff" stroke="#dce7ef"/><circle cx="90" cy="176" r="20" fill="#e9f2f8"/><text x="90" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#49758f">01</text><text x="126" y="176" font-size="20" font-weight="700" fill="#203d54">只看公开行情</text><text x="126" y="207" font-size="15" fill="#627b8e">不连接钱包、不充值</text><path d="M450 194 H548" stroke="#a2b6c5" stroke-width="2"/><text x="574" y="177" font-size="17" font-weight="700" fill="#326c5b">无需将资金交给 Ave</text><text x="574" y="207" font-size="15" fill="#627b8e">关注信息准确性和更新时效</text>
<rect x="48" y="273" width="984" height="125" rx="17" fill="#fff" stroke="#dce7ef"/><circle cx="90" cy="317" r="20" fill="#e6f5ee"/><text x="90" y="323" text-anchor="middle" font-size="15" font-weight="700" fill="#298966">02</text><text x="126" y="317" font-size="20" font-weight="700" fill="#203d54">连接自己的钱包</text><text x="126" y="348" font-size="15" fill="#627b8e">资产控制取决于钱包与授权</text><path d="M450 335 H548" stroke="#a2b6c5" stroke-width="2"/><text x="574" y="318" font-size="17" font-weight="700" fill="#326c5b">自持私钥可降低平台托管依赖</text><text x="574" y="348" font-size="15" fill="#627b8e">仍需核对签名、授权和智能合约</text>
<rect x="48" y="414" width="984" height="125" rx="17" fill="#fff" stroke="#dce7ef"/><circle cx="90" cy="458" r="20" fill="#fbefd9"/><text x="90" y="464" text-anchor="middle" font-size="15" font-weight="700" fill="#af7b2b">03</text><text x="126" y="458" font-size="20" font-weight="700" fill="#203d54">Ave Bot 钱包</text><text x="126" y="489" font-size="15" fill="#627b8e">官方协议称由 Ave 管理私钥和资产</text><path d="M450 476 H548" stroke="#a2b6c5" stroke-width="2"/><text x="574" y="459" font-size="17" font-weight="700" fill="#9b6c26">需要依赖平台的管理与提现能力</text><text x="574" y="489" font-size="15" fill="#627b8e">核对托管安排、账户安全及资产证明</text>
<rect x="48" y="566" width="984" height="42" rx="10" fill="#eaf0f6"/><text x="69" y="593" font-size="14" fill="#536e82">链上地址余额 ≠ 用户负债已被覆盖；合约入金与权限需按实际账户和授权确认。</text>
</g></svg>
