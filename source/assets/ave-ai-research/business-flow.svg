<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 730" role="img" aria-labelledby="title">
<title id="title">Ave.ai 链上现货与永续合约业务关系</title>
<defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#2387be"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#249471"/></marker></defs>
<rect width="1100" height="730" rx="26" fill="#f4f8fc"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="48" y="53" font-size="15" font-weight="700" letter-spacing="2" fill="#70879c">AVE.AI · 业务关系</text><text x="48" y="92" font-size="28" font-weight="700" fill="#173149">信息从哪里来？订单去哪里？</text>
<rect x="48" y="115" width="1004" height="330" rx="20" fill="#fff" stroke="#dce7ef"/><circle cx="85" cy="151" r="19" fill="#def3ec"/><text x="85" y="157" text-anchor="middle" font-size="15" font-weight="700" fill="#168363">1</text><text x="118" y="158" font-size="21" font-weight="700" fill="#173950">链上现货</text><text x="229" y="158" font-size="15" fill="#718799">发现代币 · 查看信息 · 提交交易</text>
<rect x="75" y="215" width="225" height="165" rx="15" fill="#f5f8fb" stroke="#d6e3ec"/><rect x="438" y="202" width="224" height="190" rx="15" fill="#eaf6ff" stroke="#afd8ed"/><rect x="800" y="215" width="225" height="165" rx="15" fill="#effaf5" stroke="#bce5d3"/>
<text x="99" y="248" font-size="13" fill="#7a8f9f">市场与资产</text><text x="99" y="281" font-size="20" font-weight="700" fill="#243e54">链上交易市场</text><text x="99" y="314" font-size="15" fill="#637a8c">代币由创建者发行</text><text x="99" y="341" font-size="15" fill="#637a8c">在支持的池子买卖</text><text x="99" y="366" font-size="13" fill="#8396a5">例如 PumpSwap</text>
<text x="462" y="237" font-size="13" fill="#3687b4">信息与交易入口</text><text x="462" y="270" font-size="23" font-weight="700" fill="#174b6c">Ave.ai</text><text x="462" y="304" font-size="15" fill="#53748a">扫链 · 行情 · 地址画像</text><text x="462" y="331" font-size="15" fill="#53748a">AI 叙事 · 下单入口</text><text x="462" y="370" font-size="13" fill="#708c9e">聚合信息，承接用户操作</text>
<text x="824" y="248" font-size="13" fill="#459f7f">交易者</text><text x="824" y="281" font-size="20" font-weight="700" fill="#245440">用户 / 钱包</text><text x="824" y="314" font-size="15" fill="#617f72">查看信息</text><text x="824" y="341" font-size="15" fill="#617f72">选择资产并提交买卖</text><text x="824" y="366" font-size="13" fill="#78988a">钱包类型影响控制方式</text>
<path d="M304 253 H433" stroke="#2387be" stroke-width="3" marker-end="url(#b)"/><text x="369" y="236" text-anchor="middle" font-size="14" fill="#287da8">行情与链上数据</text><path d="M795 270 H667" stroke="#249471" stroke-width="3" marker-end="url(#g)"/><text x="730" y="253" text-anchor="middle" font-size="14" fill="#238465">用户提交交易</text><path d="M433 350 H305" stroke="#249471" stroke-width="3" marker-end="url(#g)"/><text x="368" y="380" text-anchor="middle" font-size="14" fill="#238465">按支持的路径执行</text>
<rect x="48" y="467" width="1004" height="200" rx="20" fill="#fff" stroke="#dce7ef"/><circle cx="85" cy="503" r="19" fill="#eae6fb"/><text x="85" y="509" text-anchor="middle" font-size="15" font-weight="700" fill="#6b59b5">2</text><text x="118" y="510" font-size="21" font-weight="700" fill="#173950">永续合约</text><text x="229" y="510" font-size="15" fill="#718799">与链上现货是不同产品</text>
<rect x="75" y="544" width="225" height="90" rx="14" fill="#f5f8fb" stroke="#d6e3ec"/><rect x="438" y="544" width="224" height="90" rx="14" fill="#eaf6ff" stroke="#afd8ed"/><rect x="800" y="544" width="225" height="90" rx="14" fill="#f3f0fe" stroke="#d8d0f0"/>
<text x="99" y="578" font-size="19" font-weight="700" fill="#243e54">用户</text><text x="99" y="608" font-size="14" fill="#637a8c">选择合约、开仓或平仓</text><text x="462" y="578" font-size="19" font-weight="700" fill="#174b6c">Ave 合约界面</text><text x="462" y="608" font-size="14" fill="#53748a">看行情、下单、管理仓位</text><text x="824" y="578" font-size="19" font-weight="700" fill="#584995">Hyperliquid</text><text x="824" y="608" font-size="14" fill="#766ea0">提供对应永续市场</text><path d="M305 589 H433" stroke="#249471" stroke-width="3" marker-end="url(#g)"/><path d="M667 589 H795" stroke="#249471" stroke-width="3" marker-end="url(#g)"/>
<circle cx="63" cy="704" r="5" fill="#2387be"/><text x="76" y="709" font-size="14" fill="#61788b">行情与数据</text><circle cx="185" cy="704" r="5" fill="#249471"/><text x="198" y="709" font-size="14" fill="#61788b">交易路径</text><text x="1037" y="709" text-anchor="end" font-size="13" fill="#8295a5">示意图 · 具体路径以实际订单为准</text>
</g></svg>
